<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>STRATMAP Case Flows</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: two real cases (LITE and FULL route) on one swimlane board (people × stages); a player walks each case event by event. */
:root {
  --bg: #F5F5F3; --surface: #FFFFFF; --ink: #1B1D22; --ink-2: #5B616E; --line: #DEE1E7;
  --accent: #2E4AC4; --accent-soft: #E8ECFB; --ai: #6B4FBB; --ai-soft: #EFEAFB;
  --ok: #1F7A4D; --ok-soft: #E3F3EA; --crit: #B42318; --crit-soft: #FBE7E5; --hold: #9A5B00; --hold-soft: #FBF0DC;
  --dim: 0.42; --on-accent: #FFFFFF;
  --font-body: "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --lane-w: 150px; --col-w: 132px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121318; --surface: #1B1D24; --ink: #E9EAEE; --ink-2: #A3A8B4; --line: #2D3039;
  --accent: #8EA2FF; --accent-soft: #24294A; --ai: #B9A4F5; --ai-soft: #2C2545;
  --ok: #6FD3A0; --ok-soft: #173327; --crit: #FF8F84; --crit-soft: #3A1E1C; --hold: #F2B866; --hold-soft: #3A2D16;
  --dim: 0.38; --on-accent: #121318; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121318; --surface: #1B1D24; --ink: #E9EAEE; --ink-2: #A3A8B4; --line: #2D3039;
  --accent: #8EA2FF; --accent-soft: #24294A; --ai: #B9A4F5; --ai-soft: #2C2545;
  --ok: #6FD3A0; --ok-soft: #173327; --crit: #FF8F84; --crit-soft: #3A1E1C; --hold: #F2B866; --hold-soft: #3A2D16;
  --dim: 0.38; --on-accent: #121318; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 28px 40px; display: grid; gap: 18px; }
header { display: grid; gap: 6px; }
.eyebrow { font: 500 12px/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0; font-size: clamp(24px, 3.2vw, 34px); line-height: 1.15; font-weight: 700; text-wrap: balance; }
.lede { margin: 0; color: var(--ink-2); max-width: 74ch; }

/* route switch */
.routes { display: flex; flex-wrap: wrap; gap: 8px; }
.route { font: 600 14px/1.25 var(--font-body); text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 10px; padding: 10px 14px; cursor: pointer; display: grid; gap: 2px; min-height: 44px; flex: 1 1 260px; max-width: 460px; }
.route span { font: 400 12.5px/1.3 var(--font-body); color: var(--ink-2); }
.route[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.route:hover { border-color: var(--accent); }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0; padding: 0; list-style: none; font-size: 13px; color: var(--ink-2); }
.facts b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* player */
.player { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; padding: 10px 14px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.btn { font: 600 14px/1 var(--font-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 8px; min-height: 40px; padding: 0 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, input:focus-visible, select:focus-visible, .chip:focus-visible, .route:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); min-width: 108px; justify-content: center; }
.btn svg { width: 16px; height: 16px; }
.count { font: 500 13px/1 var(--font-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; min-width: 64px; }
.scrub { flex: 1 1 220px; min-width: 0; accent-color: var(--accent); }
.speed { font: 500 13px var(--font-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; min-height: 40px; padding: 0 8px; }
label.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* board */
.board-scroll { overflow-x: auto; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.board { position: relative; display: grid; }
.colhead { padding: 10px 10px 8px; border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); background: var(--surface); transition: background .25s; }
.colhead b { display: block; font-size: 13px; }
.colhead span { font: 400 11.5px/1.3 var(--font-mono); color: var(--ink-2); }
.colhead.on { background: var(--accent-soft); }
.corner { border-bottom: 1px solid var(--line); }
.lane { padding: 10px; border-bottom: 1px solid var(--line); display: grid; align-content: start; gap: 2px; transition: background .25s; }
.lane b { font-size: 13.5px; }
.lane span { font-size: 12px; color: var(--ink-2); line-height: 1.3; }
.lane .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-bottom: 4px; }
.lane.ai .dot { background: var(--ai); }
.lane.on { background: var(--accent-soft); }
.lane.ai.on { background: var(--ai-soft); }
.cell { border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px 7px; display: flex; flex-direction: column; gap: 6px; min-height: 84px; }
.row-last { border-bottom: 0; }
.chip { font: 500 12px/1.3 var(--font-body); text-align: left; border: 1px solid transparent; border-radius: 7px; padding: 6px 7px;
  background: var(--accent-soft); color: var(--ink); cursor: pointer; transition: opacity .25s, transform .25s, box-shadow .25s; }
.chip.ai { background: var(--ai-soft); }
.chip.decision { background: var(--ok-soft); }
.chip.hold { background: var(--hold-soft); }
.chip.refused { background: var(--crit-soft); }
.chip .n { font: 500 10.5px/1 var(--font-mono); color: var(--ink-2); display: block; margin-bottom: 3px; }
.board.playing .chip:not(.done):not(.active) { opacity: var(--dim); }
.chip.active { transform: scale(1.04); box-shadow: 0 0 0 2px var(--accent), 0 6px 18px rgba(20, 30, 80, .18); opacity: 1; }
.chip.ai.active { box-shadow: 0 0 0 2px var(--ai), 0 6px 18px rgba(60, 30, 120, .2); }
.chip.decision.active { box-shadow: 0 0 0 2px var(--ok), 0 6px 18px rgba(20, 80, 50, .18); }
.chip.hold.active { box-shadow: 0 0 0 2px var(--hold), 0 6px 18px rgba(120, 80, 20, .18); }
.chip.refused.active { box-shadow: 0 0 0 2px var(--crit), 0 6px 18px rgba(120, 20, 20, .18); }
svg.links { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
svg.links path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; }
svg.links path.ai { stroke: var(--ai); }
svg.links circle { fill: var(--accent); }
svg.links circle.ai { fill: var(--ai); }

/* narration */
.now { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 820px) { .now { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0; }
.panel h2 { margin: 0 0 4px; font-size: 19px; line-height: 1.3; text-wrap: balance; }
.who { font: 500 12.5px/1.4 var(--font-mono); color: var(--ink-2); margin: 0 0 12px; }
.io { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 520px) { .io { grid-template-columns: 1fr; } }
.io div { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.io h3 { margin: 0 0 4px; font: 600 11px/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.io p { margin: 0; font-size: 14px; }
.rule { margin: 12px 0 0; font-size: 13.5px; padding: 8px 12px; border-radius: 8px; background: var(--accent-soft); }
.rule:empty { display: none; }
.tally h2 { font-size: 15px; margin-bottom: 10px; }
.tally ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.tally li { display: grid; grid-template-columns: 124px minmax(0, 1fr) 28px; align-items: center; gap: 10px; font-size: 13px; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s; }
.tally li.ai .bar i { background: var(--ai); }
.tally li span:last-child { font: 500 12px var(--font-mono); text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12.5px; color: var(--ink-2); }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -2px; }
.lg-p::before { background: var(--accent-soft); } .lg-ai::before { background: var(--ai-soft); }
.lg-d::before { background: var(--ok-soft); } .lg-h::before { background: var(--hold-soft); } .lg-r::before { background: var(--crit-soft); }
.foot { font-size: 12.5px; color: var(--ink-2); margin: 0; max-width: 90ch; }
@media (max-width: 640px) { :root { --lane-w: 112px; --col-w: 132px; } }
@media (prefers-reduced-motion: reduce) { .chip, .bar i, .lane, .colhead { transition: none; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow">STRATMAP · two real cases from start to end</div>
    <h1 id="h1">Who did what, and what came out</h1>
    <p class="lede" id="lede"></p>
  </header>

  <div class="routes" role="group" aria-label="Choose the case">
    <button class="route" type="button" id="r-lite" data-route="lite">LITE route · Pihlaja Fysio Oy<span>Small company: K0 questions, one plan, board decision, monthly follow-up</span></button>
    <button class="route" type="button" id="r-full" data-route="full">FULL route · Vaimea Oy<span>Phases 0–4B: question rounds, 28 products, war-games, two plans, go-live</span></button>
  </div>
  <ul class="facts" id="facts"></ul>

  <div class="player" role="group" aria-label="Player">
    <button class="btn" id="prev" type="button" aria-label="Previous event"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button class="btn primary" id="play" type="button">Play</button>
    <button class="btn" id="next" type="button" aria-label="Next event"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <span class="count" id="count" aria-live="polite">1 / 1</span>
    <label class="vh" for="scrub">Event</label>
    <input class="scrub" id="scrub" type="range" min="0" max="1" value="0">
    <label class="vh" for="speed">Speed</label>
    <select class="speed" id="speed"><option value="1">1×</option><option value="1.6" selected>1.5×</option><option value="2.5">2.5×</option></select>
  </div>

  <div class="board-scroll" id="scroller">
    <div class="board" id="board" aria-label="Swimlane of the case"></div>
  </div>
  <div class="legend"><span class="lg-p">a person acts</span><span class="lg-ai">AI or HORIZON works</span><span class="lg-d">decision recorded</span><span class="lg-h">decision to revise, defer or escalate</span><span class="lg-r">refused or blocked</span></div>

  <section class="now">
    <div class="panel" aria-live="polite">
      <h2 id="nTitle"></h2>
      <p class="who" id="nWho"></p>
      <div class="io">
        <div><h3>Input</h3><p id="nIn"></p></div>
        <div><h3>Output</h3><p id="nOut"></p></div>
      </div>
      <p class="rule" id="nRule"></p>
    </div>
    <div class="panel tally">
      <h2>Actions so far</h2>
      <ul id="tally"></ul>
    </div>
  </section>
  <p class="foot" id="foot"></p>
</div>

const $ = (id) => document.getElementById(id)
const board = $('board'), scroller = $('scroller')
const KIND = { p: '', ai: 'ai', d: 'decision', h: 'hold', r: 'refused' }
const NS = 'http://www.w3.org/2000/svg'
const el = (cls, html) => { const d = document.createElement('div'); d.className = cls; if (html) d.innerHTML = html; return d }
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches

let R, EV, LANES, chips, colHeads, laneEls, tallyRows, maxCount, svg
let cur = 0, timer = null, raf = null

function build(key) {
  R = ROUTES[key]; EV = R.ev; LANES = R.lanes
  stop(); cancelAnimationFrame(raf); cur = 0
  document.querySelectorAll('.route').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.route === key)))
  $('eyebrow').textContent = R.eyebrow; $('h1').textContent = R.h1; $('lede').textContent = R.lede; $('foot').textContent = R.foot
  $('facts').replaceChildren(...R.facts.map(([n, l]) => { const li = document.createElement('li'); li.innerHTML = l ? `<b>${n}</b> ${l}` : n; return li }))
  $('scrub').max = EV.length - 1
  board.replaceChildren(); board.classList.remove('playing')
  board.style.gridTemplateColumns = `var(--lane-w) repeat(${R.cols.length}, minmax(var(--col-w), 1fr))`
  board.style.minWidth = `calc(var(--lane-w) + ${R.cols.length} * var(--col-w))`
  board.append(el('corner'))
  colHeads = R.cols.map(([n, d]) => { const h = el('colhead', `<b>${n}</b><span>${d}</span>`); board.append(h); return h })
  laneEls = {}; const cells = {}
  LANES.forEach((ln, r) => {
    const last = r === LANES.length - 1 ? ' row-last' : ''
    const lane = el('lane' + (ln.ai ? ' ai' : '') + last, `<i class="dot"></i><b>${ln.name}</b><span>${ln.role}</span>`)
    board.append(lane); laneEls[ln.id] = lane
    R.cols.forEach((_, c) => { const cell = el('cell' + last); board.append(cell); cells[ln.id + c] = cell })
  })
  chips = EV.map((e, i) => [].concat(e.l).map((l) => {
    const b = document.createElement('button')
    b.type = 'button'; b.className = 'chip ' + KIND[e.k]
    b.innerHTML = `<span class="n">${String(i + 1).padStart(2, '0')} · ${e.at.split(' ').pop()}</span>${e.t}`
    b.addEventListener('click', () => manual(i))
    cells[l + e.c].append(b); return b
  }))
  svg = document.createElementNS(NS, 'svg'); svg.setAttribute('class', 'links'); board.append(svg)
  $('tally').replaceChildren()
  tallyRows = LANES.map((ln) => {
    const li = document.createElement('li'); li.className = ln.ai ? 'ai' : ''
    li.innerHTML = `<span>${ln.name}</span><span class="bar"><i style="width:0"></i></span><span>0</span>`
    $('tally').append(li); return li
  })
  maxCount = Math.max(...LANES.map((ln) => EV.filter((e) => [].concat(e.l).includes(ln.id)).length))
  scroller.scrollLeft = 0
  go(0)
}

function box(chip) {
  const b = board.getBoundingClientRect(), r = chip.getBoundingClientRect()
  return { l: r.left - b.left, r: r.right - b.left, y: r.top - b.top + r.height / 2, x: r.left - b.left + r.width / 2 }
}
// a handoff: a curve from the previous event to this one, drawn with a travelling dot
function link(from, to, ai) {
  svg.setAttribute('width', board.scrollWidth); svg.setAttribute('height', board.scrollHeight)
  const a = box(from), z = box(to)
  const fwd = z.x >= a.x, sx = fwd ? a.r : a.l, ex = fwd ? z.l : z.r
  const same = Math.abs(a.x - z.x) < 4
  const d = same
    ? `M ${a.r} ${a.y} C ${a.r + 34} ${a.y}, ${z.r + 34} ${z.y}, ${z.r} ${z.y}`
    : `M ${sx} ${a.y} C ${sx + (fwd ? 40 : -40)} ${a.y}, ${ex - (fwd ? 40 : -40)} ${z.y}, ${ex} ${z.y}`
  const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); if (ai) p.setAttribute('class', 'ai'); svg.append(p)
  if (reduce) return
  const len = p.getTotalLength(); p.style.strokeDasharray = len; p.style.strokeDashoffset = len
  const dot = document.createElementNS(NS, 'circle'); dot.setAttribute('r', 4.5); if (ai) dot.setAttribute('class', 'ai'); svg.append(dot)
  const t0 = performance.now(), dur = 650
  const step = (t) => {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3)
    p.style.strokeDashoffset = len * (1 - e)
    const pt = p.getPointAtLength(len * e); dot.setAttribute('cx', pt.x); dot.setAttribute('cy', pt.y)
    if (k < 1) raf = requestAnimationFrame(step); else dot.remove()
  }
  raf = requestAnimationFrame(step)
}

function go(i) {
  cur = Math.max(0, Math.min(EV.length - 1, i))
  const e = EV[cur]
  chips.forEach((cs, j) => cs.forEach((c) => { c.classList.toggle('active', j === cur); c.classList.toggle('done', j < cur) }))
  colHeads.forEach((h, c) => h.classList.toggle('on', c === e.c))
  Object.entries(laneEls).forEach(([id, l]) => l.classList.toggle('on', [].concat(e.l).includes(id)))
  cancelAnimationFrame(raf); svg.replaceChildren()
  if (cur > 0) chips[cur].forEach((c) => link(chips[cur - 1][0], c, e.k === 'ai'))
  // keep the active event in view inside the board's own scroller
  const c = chips[cur][0], sr = scroller.getBoundingClientRect(), cr = c.getBoundingClientRect()
  if (cr.left < sr.left + 160 || cr.right > sr.right - 20)
    scroller.scrollTo({ left: scroller.scrollLeft + cr.left - sr.left - 180, behavior: reduce ? 'auto' : 'smooth' })
  $('nTitle').textContent = e.t
  $('nWho').textContent = `${e.who} · ${e.at}`
  $('nIn').textContent = e.i; $('nOut').textContent = e.o; $('nRule').textContent = e.rule || ''
  $('count').textContent = `${cur + 1} / ${EV.length}`; $('scrub').value = cur
  LANES.forEach((ln, r) => {
    const n = EV.slice(0, cur + 1).filter((x) => [].concat(x.l).includes(ln.id)).length
    tallyRows[r].querySelector('i').style.width = `${(n / maxCount) * 100}%`
    tallyRows[r].lastElementChild.textContent = n
  })
}
const pace = () => 2600 / Number($('speed').value)
function tick() { if (cur >= EV.length - 1) { stop(); return } go(cur + 1); timer = setTimeout(tick, pace()) }
function play() { if (cur >= EV.length - 1) go(0); board.classList.add('playing'); $('play').textContent = 'Pause'; timer = setTimeout(tick, pace() * 0.6) }
function stop() { clearTimeout(timer); timer = null; $('play').textContent = 'Play' }
function manual(i) { stop(); board.classList.add('playing'); go(i) }
$('play').addEventListener('click', () => (timer ? stop() : play()))
$('prev').addEventListener('click', () => manual(cur - 1))
$('next').addEventListener('click', () => manual(cur + 1))
$('scrub').addEventListener('input', (ev) => manual(Number(ev.target.value)))
document.addEventListener('keydown', (ev) => {
  if (ev.target.closest('input, select')) return
  if (ev.key === 'ArrowRight') manual(cur + 1)
  if (ev.key === 'ArrowLeft') manual(cur - 1)
})
addEventListener('resize', () => go(cur))
// each case has its own link: #lite or #full
const routeOf = () => (location.hash === '#full' ? 'full' : 'lite')
document.querySelectorAll('.route').forEach((b) => b.addEventListener('click', () => {
  if (location.hash !== '#' + b.dataset.route) location.hash = b.dataset.route
  else build(b.dataset.route)
}))
addEventListener('hashchange', () => build(routeOf()))
build(routeOf())
// the board is fully readable at rest; playback starts by itself unless the viewer asked for less motion
if (!reduce) setTimeout(() => { if (!timer) play() }, 1400)
</script>
